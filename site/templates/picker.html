<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{v:redirect}}
<meta name="color-scheme" content="light dark">
<title>{{v:title}}</title>
<meta name="description" content="{{v:description}}">
{{v:head_links}}
<link rel="icon" href="{{v:root}}assets/amalino.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{v:root}}assets/style.css">
</head>
<body class="picker">
<main id="main" class="wrap">
  <img class="picker-logo" src="{{v:root}}assets/amalino.svg" alt="" width="88" height="88">
  <h1>{{v:heading}}</h1>
  <p class="choose">{{v:choose}}</p>
  <ul class="picker-list">{{v:items}}</ul>
</main>
</body>
</html>
