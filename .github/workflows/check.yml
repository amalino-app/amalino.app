name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the Weblate check compares with the files the last sync wrote (git blobs)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translations (keys, placeholders, empty texts)
        run: python3 scripts/check_translations.py
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Website tests
        run: python3 -m unittest discover -s site -p 'test_*.py'
      - name: Website builds and passes its checks
        run: python3 site/build.py --site https://amalino.app --contact-email hello@amalino.app --check
