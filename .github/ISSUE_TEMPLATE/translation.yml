name: Translation
description: A text in the app or on the website is translated wrongly, sounds unnatural or is missing.
title: "[Translation] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **The quickest way to fix a text is [Weblate](https://hosted.weblate.org/engage/amalino/):** you correct the app's screens, the board words or this website's texts directly in your browser (a free account is enough), and every suggestion is checked before it reaches the app. If you'd rather describe the problem here, that's welcome too.

        This form is in English only, but you are welcome to answer in your own language.

        **Privacy:** everything here is public. Please don't include your child's name, photos, voice recordings or a backup file.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "e.g. Ukrainian"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where is the text?
      description: The screen in the app, the board, or the website page.
      placeholder: "e.g. app: Settings > Speech and voices / website: Help translate page"
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: The text now
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
      description: Your suggestion, and why if it helps.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I haven't included my child's name, photos, recordings or a backup file.
          required: true
